plugins { id 'com.android.application' }
android {
    namespace 'com.savewhy.app'
    compileSdk 35
    buildToolsVersion '34.0.0'
    defaultConfig { applicationId 'com.savewhy.app'; minSdk 26; targetSdk 35; versionCode 12; versionName '0.11.0' }
    buildFeatures { buildConfig true }
    defaultConfig {
        buildConfigField 'String', 'PLAY_BILLING_PUBLIC_KEY', '"' + providers.gradleProperty('SAVEWHY_PLAY_PUBLIC_KEY').getOrElse('').replace('\\','\\\\').replace('"','\\"') + '"'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            maxHeapSize = '1536m'
        }
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.android.billingclient:billing:8.0.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
